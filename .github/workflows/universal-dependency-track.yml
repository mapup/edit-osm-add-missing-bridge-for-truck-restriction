name: Dependency Track SBOM Scan

# PORTABLE TEMPLATE — copy into
# <your-repo>/.github/workflows/universal-dependency-track.yml as-is;
# nothing repo-specific in it. Identical to
# mapup-security-team/.github/workflows/universal-dependency-track.yml.
#
# Covers TWO of the org's tracked tools in one file: Trivy (generates the
# CycloneDX SBOM in license mode) and Dependency-Track (receives it).
#
# Required secret: DEPENDENCYTRACK_API_KEY

on:
  # No branch filters: repos differ in default-branch names. Pushes are
  # gated to the repo's actual default branch by the job-level `if` below
  # (GitHub trigger filters can't express "the default branch" dynamically);
  # PRs into any branch are scanned.
  push:
  pull_request:
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-scan:
    # Only default-branch pushes produce the canonical 'main' SBOM upload —
    # feature-branch pushes are skipped rather than overwriting it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (if needed)
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python (if needed)
        if: hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != ''
        uses: actions/setup-python@v5
        with:
          # Pinned, not '3.x'. '3.x' resolved to 3.14, where requirements.txt --
          # the repo's only one -- failed to install outright (fiona has no
          # cp314 wheel and its source build needs gdal-config), so the entire
          # dependency tree was missing from the SBOM and only the 14 names
          # Trivy could read off the manifest were reported. Every pin in
          # requirements.txt has a cp311 wheel, and 3.11 is what this repo's
          # sonarqube-monorepo-scan.yml already uses.
          python-version: '3.11'

      - name: Setup Go (if needed)
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java (if needed)
        if: hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (all languages, including monorepos)
        run: |
          echo "🔍 Detecting and installing dependencies..."

          # Install pnpm if any pnpm-lock.yaml exists (needed for mixed monorepos)
          if find . -name "pnpm-lock.yaml" -not -path "*/node_modules/*" | grep -q .; then
            echo "📦 Installing pnpm globally (detected pnpm projects)"
            npm install -g pnpm
          fi

          # Node.js: Check root first for workspace-level install
          if [ -f "pnpm-lock.yaml" ]; then
            echo "📦 Detected pnpm workspace at root"
            pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed, continuing..."
          elif [ -f "yarn.lock" ]; then
            echo "📦 Detected yarn workspace at root"
            yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed, continuing..."
          elif [ -f "package-lock.json" ]; then
            echo "📦 Found npm project at root"
            npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed, continuing..."
          elif [ -f "package.json" ]; then
            echo "📦 Found Node.js project at root (no lock file)"
            npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed, continuing..."
          fi

          # Find all subdirectories and install based on their lock files (for mixed monorepos)
          find . -type d -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "." | while read -r dir; do
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              echo "📦 Found pnpm project in: $dir"
              (cd "$dir" && pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed in $dir")
            elif [ -f "$dir/yarn.lock" ]; then
              echo "📦 Found yarn project in: $dir"
              (cd "$dir" && yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed in $dir")
            elif [ -f "$dir/package-lock.json" ]; then
              echo "📦 Found npm project in: $dir"
              (cd "$dir" && (npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed in $dir"))
            elif [ -f "$dir/package.json" ]; then
              echo "📦 Found Node.js project in: $dir (no lock file)"
              (cd "$dir" && npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed in $dir")
            fi
          done

          # Python projects
          find . -name "requirements.txt" -not -path "*/.git/*" -not -path "*/venv/*" | while read -r req; do
            dir=$(dirname "$req")
            echo "🐍 Found Python project in: $dir"
            (cd "$dir" && pip install -r requirements.txt 2>/dev/null || echo "Note: pip install failed in $dir")
          done

          # Go projects
          find . -name "go.mod" -not -path "*/.git/*" | while read -r gomod; do
            dir=$(dirname "$gomod")
            echo "🔷 Found Go project in: $dir"
            (cd "$dir" && go mod download 2>/dev/null || echo "Note: go mod download failed in $dir")
          done

          # Java/Maven projects
          find . -name "pom.xml" -not -path "*/.git/*" | while read -r pom; do
            dir=$(dirname "$pom")
            echo "☕ Found Maven project in: $dir"
            (cd "$dir" && mvn dependency:resolve 2>/dev/null || echo "Note: mvn dependency:resolve failed in $dir")
          done

          # Java/Gradle projects
          find . -name "build.gradle*" -not -path "*/.git/*" | while read -r gradle; do
            dir=$(dirname "$gradle")
            echo "☕ Found Gradle project in: $dir"
            (cd "$dir" && (./gradlew dependencies 2>/dev/null || gradle dependencies 2>/dev/null || echo "Note: gradle dependencies failed in $dir"))
          done

          echo "✅ Dependency installation complete"
        continue-on-error: true

      # Trivy's filesystem scan reads manifest files (requirements.txt), which
      # carry NO license text: the SBOM it produced had 14 components and zero
      # licenses, so every component was reported as "No License Metadata".
      # It also listed requirements.txt itself as a component, and silently
      # dropped the four ">="-pinned entries plus every transitive dependency.
      # Instead we generate the SBOM with the ecosystem-native CycloneDX tool,
      # which reads each license straight from the installed package metadata.
      - name: Generate SBOMs with resolved licenses (Python + Node)
        run: |
          set -uo pipefail
          echo "🧾 Generating SBOMs that carry real license data from installed package metadata..."
          mkdir -p /tmp/sboms

          # ---- Python: one isolated virtualenv per requirements file ----
          # cyclonedx-bom lives in its OWN venv and is pointed at each project
          # venv, rather than being installed alongside the project's packages.
          # Installing it into the project venv would record the scanner's own
          # dependency tree (cyclonedx-python-lib, license-expression,
          # py-serializable, packageurl-python, boolean.py, sortedcontainers,
          # lxml, jsonschema) as components of this repo.
          #
          # >=7 is required, not incidental: cyclonedx-python only reads PEP 639
          # "License-Expression" metadata from v7.0.0 onwards. Modern packages
          # (click, numpy, urllib3, requests, ...) have dropped the legacy
          # "License:" header and the "License ::" trove classifiers, so on an
          # older pin they emit an empty licenses array.
          python -m venv /tmp/cdx-tool
          if ! /tmp/cdx-tool/bin/pip install --quiet "cyclonedx-bom>=7,<8"; then
            echo "::error title=SBOM tooling::could not install cyclonedx-bom; no Python SBOMs will be produced"
          fi

          idx=0
          find . -iname "requirements*.txt" -not -path "*/node_modules/*" -not -path "*/.git/*" | while read -r req; do
            echo "🐍 Python SBOM for $req"
            venv_dir="/tmp/venvs/py-$idx"
            python -m venv "$venv_dir"
            (
              # shellcheck disable=SC1091
              source "$venv_dir/bin/activate"
              pip install --quiet -r "$req" || echo "⚠️  pip install failed for $req; SBOM will only reflect what installed"
            )
            /tmp/cdx-tool/bin/cyclonedx-py environment "$venv_dir/bin/python" \
              --spec-version 1.6 --output-format JSON \
              --output-file "/tmp/sboms/py-bom-$idx.json" \
              || echo "⚠️  cyclonedx-py failed for $req; skipping"
            idx=$((idx + 1))
          done

          # ---- Node: read licenses from installed node_modules, per project ----
          # This repo has no Node project today; the loop is kept so the file
          # stays a drop-in replacement for the shared org template.
          if find . -name package-lock.json -not -path '*/node_modules/*' -not -path '*/.git/*' | grep -q .; then
            npm install -g @cyclonedx/cyclonedx-npm >/dev/null 2>&1 || echo "⚠️  could not install cyclonedx-npm"
          fi
          idx=0
          find . -name package-lock.json -not -path '*/node_modules/*' -not -path '*/.git/*' | while read -r lock; do
            dir=$(dirname "$lock")
            # cyclonedx-npm errors with "missing project's manifest file" on a
            # lock file that has no sibling package.json. Skip those.
            if [ ! -f "$dir/package.json" ]; then
              echo "⏭️  Skipping $dir: package-lock.json with no package.json"
              continue
            fi
            echo "📦 Node SBOM for $dir"
            ( cd "$dir" && cyclonedx-npm --ignore-npm-errors --output-format JSON --spec-version 1.6 \
                --output-file "/tmp/sboms/node-bom-$idx.json" ) \
              || echo "⚠️  cyclonedx-npm failed in $dir; skipping"
            idx=$((idx + 1))
          done

          # ---- Merge every partial SBOM into one CycloneDX document ----
          FILES=""
          for f in /tmp/sboms/py-bom-*.json /tmp/sboms/node-bom-*.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done

          if [ -z "$FILES" ]; then
            echo "⚠️  No SBOMs were produced; writing an empty but valid CycloneDX document so the upload step still succeeds"
            echo '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,"components":[]}' > bom.json
          else
            echo "🔗 Merging:$FILES"
            jq -s '{
              bomFormat: "CycloneDX",
              specVersion: "1.6",
              version: 1,
              metadata: { tools: [ { vendor: "mapup", name: "ci-sbom-merge" } ] },
              components: ( map(.components // []) | add
                            | unique_by( (.purl // (.name + "@" + (.version // ""))) ) )
            }' $FILES > bom.json
          fi

          echo ""
          echo "📊 SBOM statistics (the fix — licenses should now be populated):"
          jq '{
            totalComponents: (.components | length),
            componentsWithLicenses: ([ .components[] | select((.licenses // []) | length > 0) ] | length)
          }' bom.json

      # Dependency-Track resolves a licenses[].expression only when it is a
      # single SPDX ID; compound expressions and legacy free-text license names
      # stay "unresolved" and get counted as No License Metadata. This step
      # rewrites those into concrete license IDs.
      #
      # Advisory only. Anything it cannot resolve is reported as a warning
      # annotation and left in the BOM, and continue-on-error keeps even an
      # outright crash from blocking the upload below -- a missing SBOM in
      # Dependency-Track is worse than one with a few unresolved licenses. The
      # script leaves bom.json untouched unless it completes successfully.
      - name: Normalize licenses so Dependency-Track can resolve them
        # Run under the cyclonedx tool venv so the script can validate its own
        # output against the CycloneDX schema before writing.
        run: /tmp/cdx-tool/bin/python .github/scripts/normalize_sbom_licenses.py bom.json
        continue-on-error: true

      - name: Upload BOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: '44.194.0.211'
          port: '8091'
          protocol: 'http'
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: ${{ github.event.repository.name }}
          projectversion: 'main'
          bomfilename: 'bom.json'
          autocreate: 'true'

      - name: Archive SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: bom.json
          retention-days: 90
